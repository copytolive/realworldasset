name: Deploy RWA.MS to GitHub Pages

on:
  push:
    branches: ["main", "fix/chat01-pixel-parity"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install visual parity runtime
        run: |
          python3 -m pip install --disable-pip-version-check pillow playwright==1.55.0
          python3 -m playwright install --with-deps chromium

      - name: Extract CHAT 01 assets from Drive references
        run: python3 scripts/extract-chat01-assets.py

      - name: Interaction verification
        run: npm run verify:interactions

      - name: Build static export
        run: npm run build

      - name: Capture CHAT 01 visual audit
        run: python3 scripts/capture-visuals.py

      - name: Upload visual audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-chat01
          path: visual-audit/
          retention-days: 2

      - name: Disable Jekyll processing
        if: github.ref == 'refs/heads/main'
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
