name: Deploy RWA.MS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Interaction verification
        run: npm run verify:interactions && npm run verify:chat04

      - name: Build static export
        run: npm run build

      - name: Install screenshot preview runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium

      - name: Capture existing visual audit
        run: python3 scripts/capture-visuals.py

      - name: Capture CHAT 04 trading visual and button audit
        run: python3 scripts/capture-chat04.py

      - name: Upload visual audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-rwa
          path: visual-audit/
          retention-days: 2

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
